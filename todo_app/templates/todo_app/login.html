<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - AI Todo</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(145deg, #eff6ff 0%, #f5f3ff 100%);
            color: #0f172a;
        }
        .card {
            width: min(430px, 94vw);
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(2, 6, 23, 0.08);
            padding: 28px;
        }
        h1 { margin: 0 0 8px; font-size: 26px; }
        p { margin: 0 0 18px; color: #64748b; }
        label { display: block; margin: 12px 0 6px; font-size: 13px; font-weight: 600; color: #334155; }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 16px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .errorlist {
            list-style: none;
            margin: 0 0 10px;
            padding: 10px 12px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            color: #991b1b;
            font-size: 13px;
        }
        .bottom { margin-top: 14px; text-align: center; font-size: 14px; color: #475569; }
        .bottom a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome back</h1>
        <p>Log in to continue to your private workspace.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
            <button type="submit">Log in</button>
        </form>
        <div class="bottom">New here? <a href="{% url 'signup' %}">Create account</a></div>
    </div>
</body>
</html>
